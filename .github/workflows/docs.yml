name: Documentation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Markdown structure and relative paths
        run: python3 scripts/check_docs.py
      - name: Verify historical research knowledge and coverage
        run: python3 scripts/research_knowledge.py check
      - name: Check RFC-0004 specification arithmetic
        run: python3 scripts/check_rfc0004_accounting.py
      - name: Check RFC-0004 public review arithmetic and symbolic state traces
        run: python3 scripts/check_rfc0004_review.py
