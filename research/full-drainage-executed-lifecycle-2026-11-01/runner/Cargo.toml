[package]
name = "full-drainage-executed-lifecycle-runner"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["local-depth-4"]
local-depth-4 = ["kpi-private-note-wallet/privacy-experiment-depth-4"]
tn10-depth-4 = ["kpi-private-note-wallet/tn10-full-drainage-depth-4"]

[dependencies]
kpi-private-note-wallet = { path = "../../../poc/private-note-wallet", default-features = false, features = ["wallet"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
hex = "=0.4.3"
bincode = "=1.3.3"

