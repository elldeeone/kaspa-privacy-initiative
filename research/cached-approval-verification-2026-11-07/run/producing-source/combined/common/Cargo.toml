[package]
name = "kpi-cached-verification-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["offline"]
offline = ["kpi-private-note-wallet/privacy-experiment-depth-4"]
testnet = ["kpi-private-note-wallet/tn10-full-drainage-depth-4"]

[dependencies]
kpi-private-note-wallet = { path = "../../private-note-wallet", default-features = false }
kpi-accelerated-bn254 = { path = "../../accelerated-bn254/common" }
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve", "std"] }
ark-groth16 = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-ff = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-serialize = { version = "=0.5.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
bincode = "=1.3.3"
