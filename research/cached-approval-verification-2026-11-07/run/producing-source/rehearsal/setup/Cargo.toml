[package]
name = "kpi-cached-testnet-setup"
version = "0.1.0"
edition = "2024"
publish = false



[dependencies]
ark-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
ark-ec = "=0.5.0"
ark-groth16 = "=0.5.0"
