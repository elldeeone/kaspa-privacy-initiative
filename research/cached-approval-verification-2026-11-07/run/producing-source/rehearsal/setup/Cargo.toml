ark-r1cs-std = "=0.5.0"
ark-crypto-primitives = { version = "=0.5.0", features = ["crh", "r1cs"] }
ark-serialize = "=0.5.0"
rand = "=0.8.5"
hex = "=0.4.3"
serde_json = "=1.0.145"

kpi-private-note-wallet = { path = "../../private-note-wallet", features=["tn10-full-drainage-depth-4"] }

