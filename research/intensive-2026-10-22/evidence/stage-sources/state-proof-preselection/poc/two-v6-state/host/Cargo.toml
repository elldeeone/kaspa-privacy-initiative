[package]
name = "kpi-two-v6-state-proof-host"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
kpi-two-v6-state = { path = "../common" }
kpi-two-v6-binding = { path = "../../two-v6-binding/common", features = ["compiled-research-instance"] }
kpi-private-note-proof = { path = "../../private-note-proof" }
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["client", "disable-dev-mode"] }
risc0-binfmt = "=3.0.4"
risc0-zkos-v1compat = "=2.2.2"
risc0-zkp = { version = "=3.0.4", default-features = false }
risc0-circuit-recursion = { version = "=4.0.4", default-features = false }
bincode = "=1.3.3"
serde_json = "=1.0.145"
hex = "=0.4.3"
