[package]
name = "kpi-recovery-native-guest"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[features]
default = ["tn10-rehearsal"]
tn10-rehearsal = ["kpi-recovery-native/tn10-rehearsal"]
tn10-full-drainage-depth-4 = ["kpi-recovery-native/tn10-full-drainage-depth-4"]
[dependencies]
kpi-recovery-native = { path = "../common", default-features = false }
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["std", "disable-dev-mode"] }
bincode = "=1.3.3"
