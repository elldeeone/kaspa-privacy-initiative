[package]
name = "kpi-recovery-native-host"
version = "0.1.0"
edition = "2021"
publish = false
[features]
default = ["proof", "tn10-rehearsal"]
proof = ["dep:kpi-private-note-proof"]
tn10-rehearsal = ["kpi-recovery-native/tn10-rehearsal", "kpi-private-note-wallet/tn10-rehearsal"]
tn10-full-drainage-depth-4 = ["kpi-recovery-native/tn10-full-drainage-depth-4", "kpi-private-note-wallet/tn10-full-drainage-depth-4"]
[dependencies]
rand = "=0.8.5"
kpi-private-note-proof = { path = "../../private-note-proof", optional = true }
kpi-recovery-native = { path = "../common", default-features = false }
kpi-private-note-wallet = { path = "../../private-note-wallet", default-features = false, features = ["wallet"] }
serde_json = "=1.0.145"
bincode = "=1.3.3"
hex = "=0.4.3"
risc0-zkvm = "=3.0.3"
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
vprogs-zk-abi = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e", default-features = false }
vprogs-zk-backend-risc0-api = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e", default-features = false }
vprogs-l1-utils = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e" }
serde = { version = "=1.0.228", features = ["derive"] }
secp256k1 = "=0.29.1"
kaspa-seq-commit = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
vprogs-zk-backend-risc0-covenant = { path = "../../takeover/vendor/covenant" }


[[bin]]
name = "kpi-recovery-native-host"
path = "src/main.rs"
required-features = ["tn10-rehearsal"]

[[bin]]
name = "kpi-recovery-native-wallet"
path = "src/bin/wallet.rs"
required-features = ["tn10-rehearsal"]

[[bin]]
name = "kpi-full-drainage-native"
path = "src/bin/full_drainage.rs"
required-features = ["tn10-full-drainage-depth-4"]
