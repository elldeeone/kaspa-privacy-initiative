[package]
name = "kpi-owner-private-relation"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "kpi-owner-private-relation"
path = "src/main.rs"
required-features = ["prover"]

[workspace]

[features]
default = ["prover"]
prover = [
    "dep:ark-r1cs-std",
    "dep:ark-relations",
    "ark-ed-on-bn254/r1cs",
    "ark-crypto-primitives/constraints",
    "ark-groth16/parallel",
    "dep:rand",
    "dep:rayon",
    "dep:serde",
    "dep:serde_json",
    "dep:hex",
]

[dependencies]
ark-bn254 = "=0.6.0"
ark-ec = "=0.6.0"
ark-ff = "=0.6.0"
ark-std = "=0.6.0"
ark-groth16 = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-serialize = "=0.6.0"
ark-ed-on-bn254 = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-crypto-primitives = { version = "=0.6.0", default-features = false, features = ["std", "commitment", "crh", "prf"] }
ark-r1cs-std = { version = "=0.6.0", optional = true }
ark-relations = { version = "=0.6.0", optional = true }
rand_chacha = "=0.3.1"
sha2 = "=0.10.9"
hmac = "=0.12.1"
rand = { version = "=0.8.5", optional = true }
rayon = { version = "=1.12.0", optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.145", optional = true }
hex = { version = "=0.4.3", optional = true }

[profile.release]
debug = 0

