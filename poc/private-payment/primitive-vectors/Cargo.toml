[package]
name = "kpi-private-primitive-vectors"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.100"
hex = "=0.4.3"
incrementalmerkletree = "=0.9.0"
orchard = { git = "https://github.com/zcash/orchard", rev = "616a669df8c9a59c33d47064d3ce04b25d026b2e", default-features = false, features = ["std", "zeroize"] }
pasta_curves = "=0.6.0"
serde_json = "=1.0.145"
serde = { version = "=1.0.228", features = ["derive"] }
zcash_note_encryption = "=0.5.1"
bincode = "=1.3.3"
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["client", "disable-dev-mode"] }
