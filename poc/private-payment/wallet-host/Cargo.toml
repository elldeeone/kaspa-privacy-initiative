[package]
name = "kpi-wallet-host"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
kpi-wallet-core = { path = "../wallet-core" }
kpi-recovery-auth-vectors = { path = "../recovery-auth-vectors" }
anyhow = "=1.0.100"
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
bincode = "=1.3.3"
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["client", "disable-dev-mode"] }
ed25519-dalek = { version = "=2.2.0", features = ["hazmat"] }
sha2 = "=0.10.9"
pasta_curves = "=0.6.0"
