[package]
name = "kpi-v6-relation-controls"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
ark-bn254 = "=0.6.0"
ark-ff = "=0.6.0"
ark-relations = "=0.6.0"
ark-r1cs-std = "=0.6.0"
ark-crypto-primitives = { version = "=0.6.0", features = ["crh", "constraints"] }
rand = "=0.8.5"
sha2 = "=0.10.9"
hmac = "=0.12.1"
crypto_box = { version = "=0.9.1", features = ["seal", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
hex = "=0.4.3"
secp256k1 = { version = "=0.29.1", features = ["rand-std"] }
[profile.release]
debug = 0
