[package]
name = "kpi-private-capacity-prover"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
autobins = false

[[bin]]
name = "kpi-private-capacity-prover"
path = "src/main.rs"

[[bin]]
name = "kpi-private-capacity-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "kpi-private-capacity-cache-probe"
path = "src/bin/cache_probe.rs"

[workspace]

[dependencies]
ark-bn254 = "=0.6.0"
ark-ec = "=0.6.0"
ark-ff = "=0.6.0"
ark-groth16 = "=0.6.0"
ark-poly = "=0.6.0"
ark-relations = "=0.6.0"
ark-r1cs-std = "=0.6.0"
ark-crypto-primitives = { version = "=0.6.0", features = ["crh", "constraints"] }
ark-serialize = "=0.6.0"
rand = "=0.8.5"
sha2 = "=0.10.9"
hmac = "=0.12.1"
rayon = "=1.12.0"

serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
hex = "=0.4.3"

[profile.release]
debug = 0

