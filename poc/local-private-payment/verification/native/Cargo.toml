[package]
name = "kpi-local-private-payment-native"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "01b532e8b553523216471682649693af92f0fd16" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hex = "=0.4.3"
bincode = "=1.3.3"
# Preserve the established genuine R0 3.0.3 closure rather than float compatible crates.
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["std", "disable-dev-mode"] }
risc0-binfmt = "=3.0.4"
risc0-zkp = { version = "=3.0.4", default-features = false }
risc0-circuit-recursion = { version = "=4.0.4", default-features = false }
risc0-circuit-rv32im = { version = "=4.0.4", default-features = false }
risc0-circuit-keccak = { version = "=4.0.5", default-features = false }
risc0-groth16 = { version = "=3.0.4", default-features = false, features = ["std"] }
risc0-zkos-v1compat = { version = "=2.2.2", default-features = false }

[profile.dev]
debug = 0
[profile.release]
debug = 0
