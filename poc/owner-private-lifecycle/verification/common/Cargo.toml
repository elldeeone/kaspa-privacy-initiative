[package]
name = "kpi-owner-private-lifecycle-verifier"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
kpi-owner-private-lifecycle-relation = { path = "../../relation", default-features = false }
ark-bn254 = { version = "=0.6.0", default-features = false, features = ["curve", "std"] }
ark-ec = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-ff = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-groth16 = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-serialize = { version = "=0.6.0", default-features = false, features = ["std"] }
substrate-bn = { git = "https://github.com/risc0/paritytech-bn", rev = "22108fe8c6ea1ebc1358fc4fd6854a6bf46e3509" }
rand = { version = "=0.8.5", default-features = false, features = ["std"] }
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["std", "disable-dev-mode"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
hex = "=0.4.3"
risc0-binfmt = { version = "=3.0.4", default-features = false }
risc0-zkp = { version = "=3.0.4", default-features = false }
risc0-circuit-recursion = { version = "=4.0.4", default-features = false }
risc0-circuit-rv32im = { version = "=4.0.4", default-features = false }
risc0-circuit-keccak = { version = "=4.0.5", default-features = false }
risc0-groth16 = { version = "=3.0.4", default-features = false }
risc0-zkos-v1compat = { version = "=2.2.2", default-features = false }
