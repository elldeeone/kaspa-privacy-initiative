[package]
name = "kpi-public-receipt-proof-extract"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
[workspace]
[dependencies]
ark-bn254 = "=0.6.0"
ark-groth16 = "=0.6.0"
ark-serialize = "=0.6.0"
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["std", "disable-dev-mode"] }
risc0-binfmt = "=3.0.4"
risc0-zkp = { version = "=3.0.4", default-features = false }
risc0-groth16 = { version = "=3.0.4", default-features = false, features = ["std"] }
risc0-circuit-recursion = { version = "=4.0.4", default-features = false }
bincode = "=1.3.3"
hex = "=0.4.3"
serde_json = "=1.0.145"
[profile.dev]
debug = 0
incremental = false
