[package]
name = "kpi-common-set-withdrawal"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ark-bn254 = "=0.6.0"
ark-ff = "=0.6.0"
ark-groth16 = "=0.6.0"
ark-relations = "=0.6.0"
ark-r1cs-std = "=0.6.0"
ark-crypto-primitives = { version = "=0.6.0", features = ["crh", "constraints"] }
ark-serialize = "=0.6.0"
ark-snark = "=0.6.0"
rand = "=0.8.5"
sha2 = "=0.10.9"
hmac = "=0.12.1"
hex = "=0.4.3"
serde_json = "=1.0.145"
secp256k1 = { version = "=0.29.1", features = ["rand-std"] }
blind-rsa-signatures = { git = "https://github.com/jedisct1/rust-blind-rsa-signatures", rev = "640084d82abd5bbe48c65c3d8e6f647c8963ec73" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "4863866fce8439d0305b410fc4d802e7261d54d0" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "4863866fce8439d0305b410fc4d802e7261d54d0" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "4863866fce8439d0305b410fc4d802e7261d54d0" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "4863866fce8439d0305b410fc4d802e7261d54d0" }

[profile.release]
debug = 0
