[package]
name = "kpi-orchard-interop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace]

[dependencies]
orchard = { git = "https://github.com/zcash/orchard", rev = "616a669df8c9a59c33d47064d3ce04b25d026b2e", default-features = false, features = ["circuit", "multicore", "std", "zeroize"] }
blake2b_simd = "1"
hex = "0.4"
nonempty = "0.11"
rand = { version = "0.10", features = ["chacha", "std", "std_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
incrementalmerkletree = "0.9"

[profile.release]
debug = false
