[workspace]

[dependencies]
ark-bn254-05 = { package = "ark-bn254", version = "=0.5.0" }
ark-ec-05 = { package = "ark-ec", version = "=0.5.0" }
ark-ff-05 = { package = "ark-ff", version = "=0.5.0" }
